[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
authors = ["Gonçalo Rica Pais da Silva <bluefinger@gmail.com>"]
edition = "2024"
repository = "https://github.com/Bluefinger/nailpit"
version = "0.1.0"
license = "AGPL-3.0-only"
rust-version = "1.89.0"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
actix-web = { version = "4.11", default-features = false, features = [
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "unicode",
    "http2",
] }
bytes = "1.10.1"
color-eyre = { version = "0.6.3", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
rand_core = "0.9.3"
rand = { version = "0.9", default-features = false }
rand_distr = { version = "0.5.1" }
wyrand = { version = "0.3.2" }
hashbrown = { version = "0.15.2", default-features = false, features = [
    "equivalent",
    "inline-more",
] }
rapidhash = { version = "4.1.0", default-features = false }
unicode-segmentation = "1.12.0"
itertools = "0.14.0"
indexmap = "2.9.0"
parking_lot = "0.12"
tokio = { version = "1.44.2", features = ["rt", "sync", "time", "parking_lot", "net", "signal"] }
futures-lite = "2.6.0"
pin-project-lite = "0.2.16"
scc = "3.3.2"
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-futures = { version = "0.2", features = ["futures-03"] }
opentelemetry = { version = "0.31.0", default-features = false, features = ["trace", "logs"] }
opentelemetry-http = "0.31"
opentelemetry-otlp = { version = "0.31.0", default-features = false, features = [
    "trace",
    "logs",
    "grpc-tonic",
    "zstd-tonic",
] }
opentelemetry_sdk = { version = "0.31.0", default-features = false, features = [
    "trace",
    "logs",
    "rt-tokio-current-thread",
    "experimental_logs_batch_log_processor_with_async_runtime",
    "experimental_trace_batch_span_processor_with_async_runtime",
] }
opentelemetry-semantic-conventions = "0.31"
winnow = { version = "0.7.6", features = ["simd"] }

[package]
name = "nailpit"
edition.workspace = true
repository.workspace = true
version.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "nailpit"

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
detailed_traces = ["nailgen/detailed_traces", "nailrater/detailed_traces"]

[dependencies]
nailkov = { path = "crates/nailkov" }
nailrng = { path = "crates/nailrng" }
nailconfig = { path = "crates/nailconfig" }
nailgen = { path = "crates/nailgen" }
nailrater = { path = "crates/nailrater" }
nailtrace = { path = "crates/nailtrace" }
nailotel = { path = "crates/nailotel" }
nailstate = { path = "crates/nailstate" }
nailip = { path = "crates/nailip" }
nailroutes = { path = "crates/nailroutes" }
nailspicy = { path = "crates/nailspicy" }
nailbox = { path = "crates/nailbox" }
actix-web.workspace = true
rand.workspace = true
tracing.workspace = true
color-eyre.workspace = true
glob = "0.3.2"
mimalloc = { version = "0.1.48", features = ["v3"], optional = true }
core_affinity = "0.8.3"

[profile.release]
codegen-units = 1
lto = "fat"
debug = false
panic = "abort"
strip = true
