[package]
name = "nailpit"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.1", default-features = false, features = ["tokio", "http1", "http2"] }
axum-core = { version = "0.5.0", default-features = false }
hyper = { version = "1.6.0", default-features = false, features = ["server"] }
hyper-util = { version = "0.1.10", default-features = false, features = ["server", "server-auto"] }
tokio = { version = "1.43.0", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "parking_lot",
    "net",
    "signal"
] }
tokio-stream = { version = "0.1.17" }
tower-service = { version = "0.3.3", default-features = false }
color-eyre = { version = "0.6.3", default-features = false }
wyrand = { version = "0.3.2", features = ["wyhash", "threadrng_wyhash", "fully_randomised_wyhash"] }
getrandom = { version = "0.3.2", features = ["std"] }
rand_core = "0.9.3"
log = { version = "0.4.27", features = ["std"] }
fastrace = { version = "0.7.9", features = ["enable"] }
fastrace-axum = "0.1.0"
logforth = { version = "0.23.1", features = ["fastrace"] }
dashmap = "6.1.0"
tower = { version = "0.5.2", features = ["buffer", "limit"]}
futures-concurrency = "7.6.3"
bytes = "1.10.1"
futures-lite = "2.6.0"
markovish = "0.2.2"
scc = "2.3.3"

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"
